services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streamit-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/streamit}
    depends_on:
      - mongodb
    networks:
      - streamit-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: streamit-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - streamit-network

  mongodb:
    image: mongo:7-jammy
    container_name: streamit-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - streamit-network

volumes:
  mongodb_data:

networks:
  streamit-network:
    driver: bridge
